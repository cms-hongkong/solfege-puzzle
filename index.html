<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音樂階梯大冒險 | 聽音評估系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif; }
        body { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        /* 共同容器樣式 */
        .screen-container { width: 100%; max-width: 1000px; background-color: rgba(255, 255, 255, 0.95); border-radius: 25px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3); overflow: hidden; padding: 30px; display: none; }
        .screen-container.active { display: block; animation: fadeIn 0.5s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #ff6b6b; font-size: 2.8rem; text-shadow: 3px 3px 0 #ffd93d; margin-bottom: 10px; }
        .subtitle { color: #4b4b4b; font-size: 1.3rem; margin-bottom: 20px; }
        
        /* ================= 起始畫面 ================= */
        .start-form { display: flex; flex-direction: column; gap: 20px; max-width: 400px; margin: 0 auto; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-group label { font-size: 1.2rem; font-weight: bold; color: #6a11cb; }
        .input-group input { padding: 15px; font-size: 1.2rem; border: 2px solid #4d96ff; border-radius: 15px; outline: none; text-align: center; }
        .difficulty-select { display: flex; gap: 10px; justify-content: space-between; }
        .diff-btn { flex: 1; padding: 15px 10px; border: 2px solid #ccc; background: white; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .diff-btn.active { border-color: #ff9a3d; background: #fff9e6; color: #ff9a3d; transform: scale(1.05); }
        .start-btn { background: linear-gradient(135deg, #00b09b, #96c93d); color: white; padding: 15px; font-size: 1.5rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .start-btn:hover { transform: translateY(-3px); }

        /* ================= 遊戲畫面 ================= */
        .game-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #e9f5ff; border-radius: 15px; padding: 15px; flex-wrap: wrap; gap: 15px; }
        .player-badge { font-size: 1.2rem; font-weight: bold; color: #6a11cb; display: flex; align-items: center; gap: 10px; background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .score-board { display: flex; gap: 15px; flex-wrap: wrap;}
        .score-item { background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .time-text { color: #f12711; }
        
        .instructions { background: #e9f5ff; border-radius: 15px; padding: 20px; margin-bottom: 25px; border-left: 8px solid #4d96ff; }
        .highlight-text { color: #ff6b6b; font-weight: bold; }
        
        .game-area { display: flex; flex-direction: column; gap: 25px; }
        @media (min-width: 768px) { .game-area { flex-direction: row; } }
        .staircase-container { flex: 2; background: #f8f9ff; border-radius: 20px; padding: 20px; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1); }
        .staircase { display: flex; flex-direction: column; align-items: center; height: 100%; position: relative; }
        
        .step { width: 90%; height: 60px; background: white; border-radius: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); border: 4px solid transparent; transition: all 0.3s ease; position: relative; z-index: 2; cursor: pointer; }
        .step.filled { transform: scale(1.05); border-color: #ffd93d; }
        .staircase-line { position: absolute; width: 8px; background: linear-gradient(to bottom, #ff6b6b, #4d96ff); top: 0; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 1; border-radius: 4px; }
        
        .cards-container { flex: 1.5; background: #fff9e6; border-radius: 20px; padding: 20px; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; flex-grow: 1; min-height: 200px; }
        .solfege-card { height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 15px; font-size: 1.5rem; font-weight: bold; color: white; cursor: grab; box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; user-select: none; }
        .solfege-card:active { transform: scale(0.95); }
        .animal-icon { font-size: 1.2rem; margin-top: 2px; }
        
        .card-do { background: linear-gradient(135deg, #FF6B6B, #FF8E8E); }
        .card-re { background: linear-gradient(135deg, #FF9A3D, #FFB56B); }
        .card-mi { background: linear-gradient(135deg, #FFD93D, #FFE57F); }
        .card-fa { background: linear-gradient(135deg, #6BCF7F, #8FDF9E); }
        .card-sol { background: linear-gradient(135deg, #4D96FF, #6BAAFF); }
        .card-la { background: linear-gradient(135deg, #9D4EDD, #B26FE6); }
        .card-ti { background: linear-gradient(135deg, #FF6B9D, #FF8EB5); }
        .card-do-high { background: linear-gradient(135deg, #e53935, #ff5252); }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin-top: auto; }
        .message { text-align: center; padding: 15px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; min-height: 70px; display: flex; align-items: center; justify-content: center; }
        .message.success { background-color: #e7f7e7; color: #2e7d32; border: 3px solid #a5d6a7; }
        .message.info { background-color: #e3f2fd; color: #1565c0; border: 3px solid #90caf9; }
        .message.warning { background-color: #fff8e1; color: #ff8f00; border: 3px solid #ffd54f; }
        .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button.action-btn { padding: 12px 20px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); flex: 1; min-width: 120px; color: white; }
        #check-btn { background: linear-gradient(135deg, #6a11cb, #2575fc); flex: 2; }
        #play-staircase-btn { background: linear-gradient(135deg, #f12711, #f5af19); }
        #next-btn { background: linear-gradient(135deg, #00b09b, #96c93d); flex: 2; display: none; }
        
        .correct-feedback, .incorrect-feedback { position: absolute; top: -10px; right: -10px; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .correct-feedback { background: #4CAF50; }
        .incorrect-feedback { background: #f44336; }
        .challenge-counter { text-align: center; font-size: 1.2rem; margin-top: 10px; color: #6a11cb; font-weight: bold; }
        @keyframes celebrate { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .celebrate { animation: celebrate 0.5s ease 3; }

        /* ================= 結算畫面 ================= */
        .result-card { background: #fff9e6; border: 4px dashed #ff9a3d; border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 25px; }
        .result-name { font-size: 2rem; color: #6a11cb; margin-bottom: 15px; }
        .result-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; font-size: 1.3rem; }
        .stat-box { background: white; padding: 15px 25px; border-radius: 15px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); font-weight: bold; }
        .result-feedback { font-size: 1.5rem; color: #f12711; font-weight: bold; background: white; padding: 20px; border-radius: 15px; border-left: 10px solid #f12711; }
    </style>
</head>
<body>

    <!-- 1. 起始畫面 -->
    <div class="screen-container active" id="start-screen">
        <header>
            <h1>🎵 音樂階梯大冒險 🎵</h1>
            <p class="subtitle">聽音評估系統</p>
        </header>
        <div class="start-form">
            <div class="input-group">
                <label for="player-name">👤 挑戰者名稱：</label>
                <input type="text" id="player-name" placeholder="輸入你的名字" autocomplete="off">
            </div>
            <div class="input-group">
                <label>⭐ 選擇難度：</label>
                <div class="difficulty-select">
                    <button class="diff-btn active" data-diff="easy">初級<br><small>(連續音階)</small></button>
                    <button class="diff-btn" data-diff="normal">中級<br><small>(少量跳躍)</small></button>
                    <button class="diff-btn" data-diff="hard">高級<br><small>(全隨機)</small></button>
                </div>
            </div>
            <button class="start-btn" id="start-game-btn">開始挑戰！🚀</button>
        </div>
    </div>

    <!-- 2. 遊戲畫面 -->
    <div class="screen-container" id="game-screen">
        <header style="margin-bottom: 15px;">
            <h1 style="font-size: 2rem;">🎵 音樂階梯挑戰 🎵</h1>
        </header>
        
        <div class="game-info">
            <div class="player-badge">👤 <span id="display-name">玩家</span> | <span id="display-diff">初級</span></div>
            <div class="score-board">
                <div class="score-item">📍 關卡: <span id="round-count">1</span>/5</div>
                <div class="score-item">💯 準確度: <span id="score">0</span>%</div>
                <div class="score-item time-text">⏱️ 時間: <span id="timer-display">00:00</span></div>
            </div>
        </div>
        
        <div class="instructions" style="padding: 15px; margin-bottom: 15px;">
            <p>💡 <span class="highlight-text">最低的階梯放 Do，越高的階梯聲音越高</span>。請將正確的音符放到對應高低的空白階梯上！</p>
            <div style="text-align: center; color: #ff6b6b; font-weight: bold; margin-top: 10px;" id="random-challenge-info">本次挑戰需要放置 X 個音符</div>
        </div>
        
        <div class="game-area">
            <div class="staircase-container">
                <div class="staircase">
                    <div class="staircase-line"></div>
                    <!-- 空白階梯 -->
                    <div class="step" data-position="8"></div>
                    <div class="step" data-position="7"></div>
                    <div class="step" data-position="6"></div>
                    <div class="step" data-position="5"></div>
                    <div class="step" data-position="4"></div>
                    <div class="step" data-position="3"></div>
                    <div class="step" data-position="2"></div>
                    <div class="step" data-position="1"></div>
                </div>
            </div>
            
            <div class="cards-container">
                <h2 style="text-align: center; color: #ff9a3d; margin-bottom: 15px;">🎴 可用音符 🎴</h2>
                <div class="cards-grid" id="cards-grid"></div>
                
                <div class="controls">
                    <div class="message info" id="message">點擊聽聲音，判斷高低，拖到正確的階梯上！</div>
                    <div class="buttons">
                        <button class="action-btn" id="play-staircase-btn">🎧 聽聽階梯</button>
                        <button class="action-btn" id="check-btn">✅ 檢查答案</button>
                        <button class="action-btn" id="next-btn">➡️ 下一關</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 結算畫面 -->
    <div class="screen-container" id="result-screen">
        <header>
            <h1>🎉 挑戰完成！ 🎉</h1>
        </header>
        <div class="result-card">
            <div class="result-name">成績單：<span id="final-name" style="font-weight: bold;">玩家</span></div>
            <div class="result-stats">
                <div class="stat-box">難度：<span id="final-diff" style="color:#ff9a3d;">初級</span></div>
                <div class="stat-box">總準確度：<span id="final-score" style="color:#4CAF50;">100%</span></div>
                <div class="stat-box">總耗時：<span id="final-time" style="color:#f12711;">00:00</span></div>
            </div>
            <div class="result-feedback" id="final-feedback">
                ⭐⭐⭐ 音樂小神童！完美過關！
            </div>
        </div>
        <div style="text-align: center;">
            <button class="start-btn" id="restart-game-btn">🔄 再玩一次</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 音效系統
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTone(frequency) {
                try {
                    if (!audioCtx) return;
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.type = 'triangle'; 
                    oscillator.frequency.value = frequency;
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start();
                    gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime); 
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                    oscillator.stop(audioCtx.currentTime + 1.2);
                } catch (e) { console.log(e); }
            }

            // 遊戲資料
            const FIXED_PAIRING = { 1: "Do", 2: "Re", 3: "Mi", 4: "Fa", 5: "Sol", 6: "La", 7: "Ti", 8: "Do'" };
            const solfegeData = [
                { name: "Do", color: "card-do", animal: "🐻", correctPosition: 1, freq: 261.63 },
                { name: "Re", color: "card-re", animal: "🐰", correctPosition: 2, freq: 293.66 },
                { name: "Mi", color: "card-mi", animal: "🐱", correctPosition: 3, freq: 329.63 },
                { name: "Fa", color: "card-fa", animal: "🐸", correctPosition: 4, freq: 349.23 },
                { name: "Sol", color: "card-sol", animal: "🐶", correctPosition: 5, freq: 392.00 },
                { name: "La", color: "card-la", animal: "🦁", correctPosition: 6, freq: 440.00 },
                { name: "Ti", color: "card-ti", animal: "🐯", correctPosition: 7, freq: 493.88 },
                { name: "Do'", color: "card-do-high", animal: "🐼", correctPosition: 8, freq: 523.25 }
            ];

            const state = {
                playerName: "訪客",
                difficulty: "easy",
                difficultyName: "初級",
                currentRound: 1,
                maxRounds: 5,
                totalCorrect: 0,
                totalPossible: 0,
                timeElapsed: 0,
                timerInterval: null,
                currentPositions: [],
                availableCards: [],
                steps: {},
                placedCards: 0,
                isComplete: false
            };

            // DOM 元素
            const screens = {
                start: document.getElementById('start-screen'),
                game: document.getElementById('game-screen'),
                result: document.getElementById('result-screen')
            };

            // 難度選擇
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    state.difficulty = e.currentTarget.dataset.diff;
                    state.difficultyName = e.currentTarget.innerHTML.split('<br>')[0];
                });
            });

            // 開始遊戲
            document.getElementById('start-game-btn').addEventListener('click', () => {
                initAudio(); // 用戶點擊按鈕，解鎖音效
                const nameInput = document.getElementById('player-name').value.trim();
                state.playerName = nameInput || "音樂小精靈";
                
                document.getElementById('display-name').textContent = state.playerName;
                document.getElementById('display-diff').textContent = state.difficultyName;
                
                resetFullGame();
                switchScreen('game');
                startTimer();
                startRound();
            });

            // 再玩一次
            document.getElementById('restart-game-btn').addEventListener('click', () => {
                switchScreen('start');
            });

            function switchScreen(screenName) {
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens[screenName].classList.add('active');
            }

            function startTimer() {
                clearInterval(state.timerInterval);
                state.timeElapsed = 0;
                updateTimerDisplay();
                state.timerInterval = setInterval(() => {
                    state.timeElapsed++;
                    updateTimerDisplay();
                }, 1000);
            }

            function updateTimerDisplay() {
                const mins = String(Math.floor(state.timeElapsed / 60)).padStart(2, '0');
                const secs = String(state.timeElapsed % 60).padStart(2, '0');
                document.getElementById('timer-display').textContent = `${mins}:${secs}`;
            }

            function resetFullGame() {
                state.currentRound = 1;
                state.totalCorrect = 0;
                state.totalPossible = 0;
                document.getElementById('score').textContent = "0";
            }

            function startRound() {
                state.isComplete = false;
                state.placedCards = 0;
                document.getElementById('round-count').textContent = state.currentRound;
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('check-btn').style.display = 'block';
                document.getElementById('play-staircase-btn').style.display = 'block';
                
                generateLevel();
                resetStaircaseDisplay();
                generateCards();
                updateStepVisibility();
                updateMessage(`第 ${state.currentRound} 關：請將 ${state.currentPositions.length} 個音符放上階梯！`, 'info');
                setupCardEvents();
            }

            function generateLevel() {
                let numSlots;
                if (state.difficulty === 'easy') {
                    numSlots = Math.floor(Math.random() * 2) + 3; // 3 or 4
                    const startPos = Math.floor(Math.random() * (8 - numSlots + 1)) + 1;
                    state.currentPositions = Array.from({length: numSlots}, (_, i) => startPos + i);
                } else if (state.difficulty === 'normal') {
                    numSlots = Math.floor(Math.random() * 2) + 4; // 4 or 5
                    state.currentPositions = getRandomPositions(numSlots);
                } else {
                    numSlots = Math.floor(Math.random() * 3) + 6; // 6, 7 or 8
                    state.currentPositions = getRandomPositions(numSlots);
                }
                
                state.totalPossible += numSlots;
                state.currentPositions.forEach(pos => state.steps[pos] = null);
                document.getElementById('random-challenge-info').textContent = `🎯 本次需要放置 ${numSlots} 個音符`;
                
                state.availableCards = solfegeData
                    .filter(item => state.currentPositions.includes(item.correctPosition))
                    .map((item, i) => ({ ...item, cardId: `card-${i}` }));
                
                // Shuffle cards
                for (let i = state.availableCards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [state.availableCards[i], state.availableCards[j]] = [state.availableCards[j], state.availableCards[i]];
                }
            }

            function getRandomPositions(count) {
                let arr = [1, 2, 3, 4, 5, 6, 7, 8];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr.slice(0, count).sort((a, b) => a - b);
            }

            // UI 渲染與拖曳邏輯 (保留原有功能)
            function generateCards() {
                const grid = document.getElementById('cards-grid');
                grid.innerHTML = '';
                state.availableCards.forEach(cardData => {
                    const card = document.createElement('div');
                    card.className = `solfege-card ${cardData.color}`;
                    card.dataset.solfege = cardData.name;
                    card.dataset.cardId = cardData.cardId;
                    card.dataset.correctPosition = cardData.correctPosition;
                    card.dataset.freq = cardData.freq;
                    card.draggable = true;
                    card.innerHTML = `<div>${cardData.name}</div><div class="animal-icon">${cardData.animal}</div>`;
                    grid.appendChild(card);
                });
            }

            function resetStaircaseDisplay() {
                document.querySelectorAll('.step').forEach(step => {
                    step.style.display = 'flex';
                    step.classList.remove('filled', 'celebrate');
                    step.style.background = 'white';
                    step.style.border = '4px solid transparent';
                    step.innerHTML = '';
                });
            }

            function updateStepVisibility() {
                document.querySelectorAll('.step').forEach(step => {
                    const pos = parseInt(step.dataset.position);
                    step.style.display = state.currentPositions.includes(pos) ? 'flex' : 'none';
                });
            }

            function setupCardEvents() {
                document.querySelectorAll('.solfege-card').forEach(card => {
                    card.addEventListener('mousedown', () => {
                        if (!state.isComplete && card.style.opacity !== '0.3') playTone(parseFloat(card.dataset.freq));
                    });
                    card.addEventListener('touchstart', () => {
                        if (!state.isComplete && card.style.opacity !== '0.3') playTone(parseFloat(card.dataset.freq));
                    }, {passive: true});
                    card.addEventListener('dragstart', e => {
                        if (state.isComplete || e.target.style.opacity === '0.3') { e.preventDefault(); return; }
                        const t = e.target;
                        e.dataTransfer.setData('text/plain', JSON.stringify({ solfege: t.dataset.solfege, cardId: t.dataset.cardId, freq: t.dataset.freq, correctPosition: t.dataset.correctPosition }));
                        setTimeout(() => t.style.opacity = '0.4', 0);
                    });
                    card.addEventListener('click', e => {
                        if (state.isComplete) return;
                        const c = e.target.closest('.solfege-card');
                        if (!c || c.style.opacity === '0.3') return;
                        for (let pos of state.currentPositions) {
                            if (!state.steps[pos]) {
                                placeCard(document.querySelector(`.step[data-position="${pos}"]`), pos, { solfege: c.dataset.solfege, cardId: c.dataset.cardId, freq: c.dataset.freq, correctPosition: c.dataset.correctPosition });
                                break;
                            }
                        }
                    });
                });
                
                document.querySelectorAll('.step').forEach(step => {
                    step.addEventListener('dragover', e => e.preventDefault());
                    step.addEventListener('drop', e => {
                        e.preventDefault();
                        const s = e.target.closest('.step');
                        if (!s || state.isComplete) return;
                        const pos = parseInt(s.dataset.position);
                        if (!state.currentPositions.includes(pos) || state.steps[pos]) return;
                        try { placeCard(s, pos, JSON.parse(e.dataTransfer.getData('text/plain'))); } catch (err) {}
                    });
                    step.addEventListener('click', e => {
                        const s = e.target.closest('.step');
                        if (!s || state.isComplete) return;
                        const pos = parseInt(s.dataset.position);
                        if (state.steps[pos]) removeCard(pos);
                    });
                });
            }

            function getCardColor(s) {
                const map = { 'Do':'linear-gradient(135deg, #FF6B6B, #FF8E8E)', 'Re':'linear-gradient(135deg, #FF9A3D, #FFB56B)', 'Mi':'linear-gradient(135deg, #FFD93D, #FFE57F)', 'Fa':'linear-gradient(135deg, #6BCF7F, #8FDF9E)', 'Sol':'linear-gradient(135deg, #4D96FF, #6BAAFF)', 'La':'linear-gradient(135deg, #9D4EDD, #B26FE6)', 'Ti':'linear-gradient(135deg, #FF6B9D, #FF8EB5)', "Do'":'linear-gradient(135deg, #e53935, #ff5252)' };
                return map[s] || '#fff';
            }

            function placeCard(step, pos, data) {
                playTone(parseFloat(data.freq));
                state.steps[pos] = data.solfege;
                state.placedCards++;
                const animal = solfegeData.find(i => i.correctPosition == data.correctPosition).animal;
                
                step.innerHTML = `<div style="font-size: 1.5rem; font-weight: bold; color: white; text-shadow: 2px 2px 0 rgba(0,0,0,0.2);">${data.solfege} <span class="animal-icon">${animal}</span></div>`;
                step.classList.add('filled');
                step.style.background = getCardColor(data.solfege);
                
                const cardUI = document.querySelector(`.solfege-card[data-card-id="${data.cardId}"]`);
                if (cardUI) { cardUI.style.opacity = '0.3'; cardUI.draggable = false; }
            }

            function removeCard(pos) {
                const solfege = state.steps[pos];
                state.steps[pos] = null;
                state.placedCards--;
                
                const step = document.querySelector(`.step[data-position="${pos}"]`);
                step.innerHTML = ``;
                step.classList.remove('filled');
                step.style.background = 'white';
                
                for (let c of document.querySelectorAll('.solfege-card')) {
                    if (c.dataset.solfege === solfege && c.style.opacity === '0.3') {
                        c.style.opacity = '1'; c.draggable = true; break;
                    }
                }
            }

            function updateMessage(txt, type) {
                const msg = document.getElementById('message');
                msg.textContent = txt;
                msg.className = `message ${type}`;
            }

            document.getElementById('check-btn').addEventListener('click', () => {
                if (state.placedCards < state.currentPositions.length) return updateMessage("還有位置沒放卡片哦！", "warning");
                
                let roundCorrect = 0;
                state.currentPositions.forEach(pos => {
                    const step = document.querySelector(`.step[data-position="${pos}"]`);
                    if (state.steps[pos] === FIXED_PAIRING[pos]) {
                        roundCorrect++;
                        if(!step.querySelector('.correct-feedback')) step.innerHTML += '<div class="correct-feedback">✓</div>';
                    } else {
                        if(!step.querySelector('.incorrect-feedback')) step.innerHTML += '<div class="incorrect-feedback">✗</div>';
                        step.style.border = '4px solid #ff6b6b';
                        setTimeout(() => step.style.border = '4px solid transparent', 1500);
                    }
                });
                
                state.totalCorrect += roundCorrect;
                const acc = Math.round((state.totalCorrect / state.totalPossible) * 100);
                document.getElementById('score').textContent = acc;
                
                if (roundCorrect === state.currentPositions.length) {
                    state.isComplete = true;
                    document.getElementById('check-btn').style.display = 'none';
                    document.getElementById('play-staircase-btn').style.display = 'none';
                    
                    document.querySelectorAll('.step').forEach(s => { if(s.style.display !== 'none') s.classList.add('celebrate'); });
                    
                    if (state.currentRound < state.maxRounds) {
                        updateMessage("🎉 完美！聽下你排嘅音階！", "success");
                        document.getElementById('next-btn').style.display = 'block';
                        document.getElementById('next-btn').textContent = "➡️ 下一關";
                        setTimeout(playCurrentStaircase, 500);
                    } else {
                        updateMessage("🏆 挑戰完成！睇下你嘅成績！", "success");
                        document.getElementById('next-btn').style.display = 'block';
                        document.getElementById('next-btn').textContent = "📊 查看成績";
                        setTimeout(playCurrentStaircase, 500);
                    }
                } else {
                    updateMessage(`呢關答對了 ${roundCorrect}/${state.currentPositions.length} 個！聽下邊度唔啱音？`, "warning");
                }
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                if (state.currentRound < state.maxRounds) {
                    state.currentRound++;
                    startRound();
                } else {
                    endGame();
                }
            });

            document.getElementById('play-staircase-btn').addEventListener('click', playCurrentStaircase);

            function playCurrentStaircase() {
                const btn = document.getElementById('play-staircase-btn');
                btn.disabled = true;
                let delay = 0;
                state.currentPositions.forEach(pos => {
                    const sol = state.steps[pos];
                    if (sol) {
                        setTimeout(() => {
                            let freq = solfegeData.find(i => i.name === sol).freq;
                            playTone(freq);
                            const step = document.querySelector(`.step[data-position="${pos}"]`);
                            step.style.transform = 'scale(1.1)';
                            setTimeout(() => step.style.transform = step.classList.contains('filled') ? 'scale(1.05)' : 'scale(1)', 300);
                        }, delay * 600);
                        delay++;
                    }
                });
                setTimeout(() => btn.disabled = false, delay * 600 + 500);
            }

            function endGame() {
                clearInterval(state.timerInterval);
                
                const finalAcc = Math.round((state.totalCorrect / state.totalPossible) * 100);
                document.getElementById('final-name').textContent = state.playerName;
                document.getElementById('final-diff').textContent = state.difficultyName;
                document.getElementById('final-score').textContent = `${finalAcc}%`;
                document.getElementById('final-time').textContent = document.getElementById('timer-display').textContent;
                
                let feedback = "";
                if (finalAcc === 100) {
                    feedback = state.timeElapsed < 60 ? "⭐⭐⭐ 音樂小神童！完美又快速！🎶" : "⭐⭐⭐ 完美過關！對音高非常有感覺！👏";
                } else if (finalAcc >= 80) {
                    feedback = "⭐⭐ 做得好好！差少少就完美啦！👍";
                } else if (finalAcc >= 50) {
                    feedback = "⭐ 唔錯呀！繼續努力練習耳仔！💪";
                } else {
                    feedback = "唔緊要，慢慢聽多啲就會熟！👂";
                }
                document.getElementById('final-feedback').textContent = feedback;
                
                switchScreen('result');
            }
        });
    </script>
</body>
</html>
